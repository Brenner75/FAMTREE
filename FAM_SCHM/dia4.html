<script>                                                                                                                                                      
    function getQueryParam(name) {                                                                                                                            
      const params = new URLSearchParams(window.location.search);                                                                                             
      return params.get(name);                                                                                                                                
    }                                                                                                                                                         
  const params = new URLSearchParams(window.location.search);                                                                                                 
  const backParam = params.get('back');                                                                                                                       
  if (backParam) {                                                                                                                                            
    sessionStorage.setItem('backUrl', backParam);                                                                                                             
  }                                                                                                                                                           
  document.getElementById("backButton").addEventListener("click", () => {                                                                                     
    const storedBack = sessionStorage.getItem("backUrl");                                                                                                     
    if (storedBack) {                                                                                                                                         
      window.location.href = storedBack;                                                                                                                      
    } else {                                                                                                                                                  
      alert("Keine Rücksprungadresse gespeichert.");                                                                                                         
    }                                                                                                                                                         
  });                                                                                                                                                         
  const foto = document.getElementById("foto");                                                                                                               
  foto.addEventListener("click", () => {                                                                                                                      
    if (!document.fullscreenElement) {                                                                                                                        
      if (foto.requestFullscreen) {                                                                                                                           
        foto.requestFullscreen();                                                                                                                             
     } else if (foto.webkitRequestFullscreen) { // Safari                                                                                                     
        foto.webkitRequestFullscreen();                                                                                                                       
      } else if (foto.msRequestFullscreen) { // IE11                                                                                                          
        foto.msRequestFullscreen();                                                                                                                           
      }                                                                                                                                                       
    } else {                                                                                                                                                  
      if (document.exitFullscreen) {                                                                                                                          
        document.exitFullscreen();                                                                                                                            
      }                                                                                                                                                       
    }                                                                                                                                                         
  });                                                                                                                                                         
 const img = document.getElementById('foto');const MAX_H = 1024;  // maximale Höhe in px                                                                     
  const buttonRow = document.getElementById('button-row');                                                                                                    
function resizeFixedImg() {                                                                                                                                   
  const vh = window.innerHeight;                                                                                                                              
  const vw = window.innerWidth;                                                                                                                               
  const naturalW = img.naturalWidth;                                                                                                                          
  const naturalH = img.naturalHeight;                                                                                                                         
  const ratio = naturalW / naturalH;                                                                                                                          
  let h = Math.min(MAX_H, vh - 200);                                                                                                                          
  let w = h * ratio;                                                                                                                                          
  if (w > vw - 20) {                                                                                                                                          
    w = vw - 20;                                                                                                                                              
    h = w / ratio;                                                                                                                                            
  }                                                                                                                                                           
  img.style.width = w + 'px';                                                                                                                                 
  img.style.height = h + 'px';                                                                                                                                
  buttonRow.style.width = w + 'px';                                                                                                                           
  const scaleX = w / naturalW;                                                                                                                                
  const scaleY = h / naturalH;                                                                                                                                
  const overlays = document.querySelectorAll('.overlay');                                                                                                     
  overlays.forEach(overlay => {                                                                                                                               
  const left = parseFloat(overlay.dataset.left) * scaleX;                                                                                                     
  const top = parseFloat(overlay.dataset.top) * scaleY;                                                                                                       
  const width = parseFloat(overlay.dataset.width) * scaleX;                                                                                                   
  const height = parseFloat(overlay.dataset.height) * scaleY;                                                                                                 
   overlay.style.position = 'absolute';                                                                                                                       
   overlay.style.left = `${left}px`;                                                                                                                          
   overlay.style.top = `${top}px`;                                                                                                                            
   overlay.style.width = `${width}px`;                                                                                                                        
   overlay.style.height = `${height}px`;                                                                                                                      
  });                                                                                                                                                         
}                                                                                                                                                             
window.addEventListener('load',  resizeFixedImg);window.addEventListener('resize', resizeFixedImg);                                                           
</script>
